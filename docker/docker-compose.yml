services:
  user2-1c-embedder:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: user2-1c-embedder
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Путь к локальному GGUF-файлу модели на хосте
      - ./models/USER2-1C-code-f16.gguf:/models/model.gguf:ro
    command: >
      -m /models/model.gguf
      --embedding
      --pooling cls
      -c 8192
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
